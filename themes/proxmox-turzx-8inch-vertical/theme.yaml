# Proxmox Turzx 8" vertical theme - 8.8" portrait (480x1920) - console / TUI style
#
# Target: 8.8" panel (1920x480 native) mounted vertically, so the logical canvas
# is 480 wide x 1920 tall. Set display.revision: C.
#
# Two stacked per-server panels, each with CPU/MEM history histograms, a
# side-by-side network download/upload histogram and a guest list. Panels are
# addressed by index into the servers list (servers[0], servers[1]), and the
# list widget's `server: <index|name>` selects which server's guests to show,
# so the theme works for any two servers.
#
# The panel dividers in background.png are aligned with the header blocks below:
#   y=152  panel 1 header / CPU section
#   y=984  panel 1 / panel 2
#   y=1094 panel 2 header / CPU section
# Keep them in sync when moving widgets.
#
# Widgets use Python format-string bindings resolved against the data context.
# Available top-level keys: time, date, summary, servers, server, nodes, node,
# guests. Inside a `list` widget, {item.x} (or {guest.x} / {node.x}) refers to
# the current row.
---
display:
  size: '8.8"'
  orientation: portrait
  rgb_led: 0, 160, 90

static_images:
  BACKGROUND:
    path: background.png
    x: 0
    y: 0
    width: 480
    height: 1920

static_text:
  P1_CPU_LABEL:
    text: "CPU"
    x: 24
    y: 192
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 28
    font_color: 0, 150, 90
    background_image: background.png

  P1_MEM_LABEL:
    text: "MEM"
    x: 24
    y: 306
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 28
    font_color: 255, 179, 0
    background_image: background.png

  P1_NET_LABEL:
    text: "NET"
    x: 24
    y: 416
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 28
    font_color: 0, 176, 255
    background_image: background.png

  P1_GUESTS_LABEL:
    text: "GUESTS"
    x: 24
    y: 554
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 28
    font_color: 0, 150, 90
    background_image: background.png

  P2_CPU_LABEL:
    text: "CPU"
    x: 24
    y: 1134
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 28
    font_color: 0, 150, 90
    background_image: background.png

  P2_MEM_LABEL:
    text: "MEM"
    x: 24
    y: 1248
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 28
    font_color: 255, 179, 0
    background_image: background.png

  P2_NET_LABEL:
    text: "NET"
    x: 24
    y: 1358
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 28
    font_color: 0, 176, 255
    background_image: background.png

  P2_GUESTS_LABEL:
    text: "GUESTS"
    x: 24
    y: 1496
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 28
    font_color: 0, 150, 90
    background_image: background.png

widgets:
  # --- Global header ------------------------------------------------------
  - type: text
    x: 24
    y: 20
    value: "SRV {summary.servers_online}/{summary.servers_total}  NODE {summary.nodes_online}/{summary.nodes_total}  VM {summary.vms_running}/{summary.vms_total}  CT {summary.cts_running}/{summary.cts_total}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 20
    font_color: 200, 255, 210

  # ========================================================================
  # Panel 1 - servers[0]
  # ========================================================================
  - type: text
    x: 24
    y: 64
    value: "> {servers[0].name}"
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 36
    font_color: 0, 230, 118

  - type: text
    x: 456
    y: 64
    value: "{servers[0].host}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 20
    font_color: 200, 255, 210
    align: right
    anchor: rt

  - type: text
    x: 24
    y: 116
    value: "{servers[0].status}  PVE {servers[0].version}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 20
    font_color: 200, 255, 210

  - type: text
    x: 456
    y: 116
    value: "node {servers[0].node_count}  vm/ct {servers[0].running_count}/{servers[0].guest_count}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 20
    font_color: 200, 255, 210
    align: right
    anchor: rt

  - type: histogram
    x: 84
    y: 178
    width: 288
    height: 92
    value: "{servers[0].cpu_percent}"
    history: 60
    min_value: 0
    max_value: 100
    bar_color: 0, 230, 118
    bar_width: 3
    bar_gap: 5
    axis: true
    axis_color: 0, 90, 55

  - type: text
    x: 456
    y: 194
    value: "{servers[0].cpu_percent:>3.0f}%"
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 30
    font_color: 0, 230, 118
    align: right
    anchor: rt

  - type: histogram
    x: 84
    y: 292
    width: 288
    height: 92
    value: "{servers[0].mem_percent}"
    history: 60
    min_value: 0
    max_value: 100
    bar_color: 255, 179, 0
    bar_width: 3
    bar_gap: 5
    axis: true
    axis_color: 0, 90, 55

  - type: text
    x: 456
    y: 308
    value: "{servers[0].mem_percent:>3.0f}%"
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 30
    font_color: 255, 179, 0
    align: right
    anchor: rt

  - type: text
    x: 84
    y: 414
    value: "dn {servers[0].net_in_human}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 22
    font_color: 0, 176, 255

  - type: text
    x: 276
    y: 414
    value: "up {servers[0].net_out_human}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 22
    font_color: 0, 176, 255

  - type: histogram
    x: 84
    y: 444
    width: 176
    height: 86
    value: "{servers[0].net_in}"
    history: 40
    min_value: 0
    autoscale: true
    bar_color: 0, 176, 255
    bar_width: 3
    bar_gap: 5
    axis: true
    axis_color: 0, 70, 130

  - type: histogram
    x: 276
    y: 444
    width: 176
    height: 86
    value: "{servers[0].net_out}"
    history: 40
    min_value: 0
    autoscale: true
    bar_color: 0, 176, 255
    bar_width: 3
    bar_gap: 5
    axis: true
    axis_color: 0, 70, 130

  - type: list
    x: 24
    y: 592
    width: 432
    rows: 6
    row_height: 60
    page_interval: 10
    server: 0
    sort_by: cpu_percent
    sort_reverse: true
    fields:
      - x: 0
        width: 276
        value: "{item.kind} {item.name}"
        font: roboto-mono/RobotoMono-Regular.ttf
        font_size: 28
        font_color: 200, 255, 210
      - x: 280
        width: 18
        value: "{item.status_short}"
        font: roboto-mono/RobotoMono-Bold.ttf
        font_size: 24
        font_color: 0, 150, 90
        align: right
        color_value: "{item.status}"
        color_map:
          running: "0, 230, 118"
          stopped: "255, 60, 60"
          paused: "255, 179, 0"
      - x: 300
        width: 64
        value: "{item.cpu_percent:>3.0f}%"
        font: roboto-mono/RobotoMono-Bold.ttf
        font_size: 26
        font_color: 0, 230, 118
        align: right
      - x: 366
        width: 64
        value: "{item.mem_percent:>3.0f}%"
        font: roboto-mono/RobotoMono-Bold.ttf
        font_size: 26
        font_color: 255, 179, 0
        align: right

  # ========================================================================
  # Panel 2 - servers[1]
  # ========================================================================
  - type: text
    x: 24
    y: 1006
    value: "> {servers[1].name}"
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 36
    font_color: 0, 230, 118

  - type: text
