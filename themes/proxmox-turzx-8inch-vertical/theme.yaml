    y: 1006
    value: "{servers[1].host}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 20
    font_color: 200, 255, 210
    align: right
    anchor: rt

  - type: text
    x: 24
    y: 1058
    value: "{servers[1].status}  PVE {servers[1].version}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 20
    font_color: 200, 255, 210

  - type: text
    x: 456
    y: 1058
    value: "node {servers[1].node_count}  vm/ct {servers[1].running_count}/{servers[1].guest_count}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 20
    font_color: 200, 255, 210
    align: right
