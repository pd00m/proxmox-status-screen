# Proxmox Turzx 8" horizontal theme - 8.8" landscape (1920x480) - console / TUI style
#
# The proxmox-turzx-8inch-vertical layout reflowed for the 1920x480 landscape
# canvas: two side-by-side server panels, each with CPU/MEM/NET histograms and a
# guest list. Panels are addressed by index into the servers list (servers[0],
# servers[1]) and the list widget's `server: <index|name>` selects which server's
# guests to show, so the theme works for any two servers.
#
# The divider lines baked into background.png are aligned with the layout:
#   y=2    top border
#   y=40   global header / panels
#   y=106  panel header / body
#   x=960  panel 1 / panel 2
#   x=480, x=1440  metrics / guest list
#   y=470  bottom border
# Keep them in sync when moving widgets.
#
# Widgets use Python format-string bindings resolved against the data context.
# Available top-level keys: time, date, summary, servers, server, nodes, node,
# guests. Inside a `list` widget, {item.x} (or {guest.x} / {node.x}) refers to
# the current row.
---
display:
  size: '8.8"'
  orientation: landscape
  rgb_led: 0, 160, 90

static_images:
  BACKGROUND:
    path: background.png
    x: 0
    y: 0
    width: 1920
    height: 480

static_text:
  P1_CPU_LABEL:
    text: "CPU"
    x: 16
    y: 116
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 24
    font_color: 0, 230, 118
    background_image: background.png

  P1_MEM_LABEL:
    text: "MEM"
    x: 16
    y: 210
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 24
    font_color: 255, 179, 0
    background_image: background.png

  P1_NET_LABEL:
    text: "NET"
    x: 16
    y: 304
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 24
    font_color: 0, 176, 255
    background_image: background.png

  P1_GUESTS_LABEL:
    text: "GUESTS"
    x: 490
    y: 116
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 24
    font_color: 0, 150, 90
    background_image: background.png

  P2_CPU_LABEL:
    text: "CPU"
    x: 976
    y: 116
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 24
    font_color: 0, 230, 118
    background_image: background.png

  P2_MEM_LABEL:
    text: "MEM"
    x: 976
    y: 210
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 24
    font_color: 255, 179, 0
    background_image: background.png

  P2_NET_LABEL:
    text: "NET"
    x: 976
    y: 304
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 24
    font_color: 0, 176, 255
    background_image: background.png

  P2_GUESTS_LABEL:
    text: "GUESTS"
    x: 1450
    y: 116
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 24
    font_color: 0, 150, 90
    background_image: background.png

widgets:
  # --- Global header ------------------------------------------------------
  - type: text
    x: 16
    y: 13
    value: "SRV {summary.servers_online}/{summary.servers_total}  NODE {summary.nodes_online}/{summary.nodes_total}  VM {summary.vms_running}/{summary.vms_total}  CT {summary.cts_running}/{summary.cts_total}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 20
    font_color: 200, 255, 210

  # ========================================================================
  # Panel 1 - servers[0]
  # ========================================================================
  - type: text
    x: 16
    y: 46
    value: "> {servers[0].name}"
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 32
    font_color: 0, 230, 118

  - type: text
    x: 944
    y: 46
    value: "{servers[0].host}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 18
    font_color: 200, 255, 210
    align: right
    anchor: rt

  - type: text
    x: 16
    y: 82
    value: "{servers[0].status}  PVE {servers[0].version}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 18
    font_color: 200, 255, 210

  - type: text
    x: 944
    y: 82
    value: "node {servers[0].node_count}  vm/ct {servers[0].running_count}/{servers[0].guest_count}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 18
    font_color: 200, 255, 210
    align: right
    anchor: rt

  - type: text
    x: 466
    y: 116
    value: "{servers[0].cpu_percent:>3.0f}%"
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 26
    font_color: 0, 230, 118
    align: right
    anchor: rt

  - type: histogram
    x: 76
    y: 112
    width: 300
    height: 78
    value: "{servers[0].cpu_percent}"
    history: 60
    min_value: 0
    max_value: 100
    bar_color: 0, 230, 118
    bar_width: 3
    bar_gap: 5
    axis: true
    axis_color: 0, 70, 50

  - type: text
    x: 466
    y: 210
    value: "{servers[0].mem_percent:>3.0f}%"
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 26
    font_color: 255, 179, 0
    align: right
    anchor: rt

  - type: histogram
    x: 76
    y: 206
    width: 300
    height: 78
    value: "{servers[0].mem_percent}"
    history: 60
    min_value: 0
    max_value: 100
    bar_color: 255, 179, 0
    bar_width: 3
    bar_gap: 5
    axis: true
    axis_color: 80, 55, 0

  - type: text
    x: 76
    y: 306
    value: "dn {servers[0].net_in_human}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 18
    font_color: 0, 176, 255

  - type: text
    x: 240
    y: 306
    value: "up {servers[0].net_out_human}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 18
    font_color: 0, 176, 255

  - type: histogram
    x: 76
    y: 328
    width: 145
    height: 78
    value: "{servers[0].net_in}"
    history: 40
    min_value: 0
    autoscale: true
    bar_color: 0, 176, 255
    bar_width: 3
    bar_gap: 5
    axis: true
    axis_color: 0, 70, 130

  - type: histogram
    x: 231
    y: 328
    width: 145
    height: 78
    value: "{servers[0].net_out}"
    history: 40
    min_value: 0
    autoscale: true
    bar_color: 0, 176, 255
    bar_width: 3
    bar_gap: 5
    axis: true
    axis_color: 0, 70, 130

  - type: list
    x: 490
    y: 140
    width: 454
    rows: 6
    row_height: 54
    page_interval: 10
    server: 0
    sort_by: cpu_percent
    sort_reverse: true
    fields:
      - x: 0
        width: 250
        value: "{item.kind} {item.name}"
        font: roboto-mono/RobotoMono-Regular.ttf
        font_size: 26
        font_color: 200, 255, 210
      - x: 252
        width: 18
        value: "{item.status_short}"
        font: roboto-mono/RobotoMono-Bold.ttf
        font_size: 22
        font_color: 0, 150, 90
        align: right
        color_value: "{item.status}"
        color_map:
          running: "0, 230, 118"
          stopped: "255, 60, 60"
          paused: "255, 179, 0"
      - x: 284
        width: 64
        value: "{item.cpu_percent:>3.0f}%"
        font: roboto-mono/RobotoMono-Bold.ttf
        font_size: 24
        font_color: 0, 230, 118
        align: right
      - x: 354
        width: 64
        value: "{item.mem_percent:>3.0f}%"
        font: roboto-mono/RobotoMono-Bold.ttf
        font_size: 24
        font_color: 255, 179, 0
        align: right

  # ========================================================================
  # Panel 2 - servers[1]
  # ========================================================================
  - type: text
    x: 976
    y: 46
    value: "> {servers[1].name}"
    font: roboto-mono/RobotoMono-Bold.ttf
    font_size: 32
    font_color: 0, 230, 118

  - type: text
    x: 1904
    y: 46
    value: "{servers[1].host}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 18
    font_color: 200, 255, 210
    align: right
    anchor: rt

  - type: text
    x: 976
    y: 82
    value: "{servers[1].status}  PVE {servers[1].version}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 18
    font_color: 200, 255, 210

  - type: text
    x: 1904
    y: 82
    value: "node {servers[1].node_count}  vm/ct {servers[1].running_count}/{servers[1].guest_count}"
    font: roboto-mono/RobotoMono-Regular.ttf
    font_size: 18
    font_color: 200, 255, 210
    align: right
